<!DOCTYPE html>
<html>
<head>
<link rel="icon" type="image/png" href="Images/favicon.png.ico">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Black Hole Vortex</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
  canvas { position:fixed; left:0; top:0; display:block; width:100vw; height:100vh;
           touch-action:none; cursor:crosshair; }
  /* the white side of it, where the spider is */
  #w { background:#fff; display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="w"></canvas>

<script>
(function () {
'use strict';

var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl', { alpha:false, antialias:false, preserveDrawingBuffer:false })
      || canvas.getContext('experimental-webgl', { alpha:false, antialias:false });
if (!gl) return;

var DPR = Math.min(window.devicePixelRatio || 1, 1.5);
var W = 1, H = 1;

/* the shadow is small; the gravity well it sits in is not.
   these are the sizes at full size, S = 1; everything below is scaled by S,
   which starts at a pinprick and ends larger than the page. */
var R_SHADOW0 = 0.009;
var R_LENS0   = 0.0275;
var GRAV0     = 0.00000025;
var CAPTURE0  = 0.045;

/* it opens as a speck of light and takes about a minute to outgrow the page.
   feeding it stars hurries that along; left alone it still gets there. */
var GROW_SECONDS = 70;
var S_START = 0.14, S_END = 120;
var grow = 0, S = S_START;

var R_SHADOW = R_SHADOW0 * S;
var R_LENS   = R_LENS0   * S;
var GRAV     = GRAV0     * S * S * S;   /* keeps the orbits turning at one rate */
var CAPTURE  = CAPTURE0  * S;
var CAPTURE_Z = 1.8;                    /* how far back into the deep it reaches */

/* the turn: the dark goes white, and the white is where the spider lives */
var ending = false, endT = 0, white = 0;
var WHITEOUT = 0.8;

var SPACE = 0, WEB = 1;
var phase = SPACE;

/* ---------------------------------------------------------------- shaders */

var VERT_QUAD =
  'attribute vec2 aPos;varying vec2 vUv;' +
  'void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}';

/* feedback. two different smears blended together:
     - out at the edges, the frame is dragged back toward the vanishing point,
       so fast stars streak along the way they are actually travelling
     - near the hole, the frame is swirled and pulled in, so captured matter
       appears to be drawn out of a star and wound into the disk
   in the calm middle of the screen there is almost no trail at all          */
var FRAG_FEED =
  'precision highp float;varying vec2 vUv;' +
  'uniform sampler2D uPrev;uniform vec2 uHole;' +
  'uniform float uAspect,uSwirl,uLens;' +
  'void main(){' +
  '  vec2 asp=vec2(uAspect,1.0);' +
  '  vec2 c=vec2(0.5);' +
  /* --- streaks, edges only. the smear has to travel AGAINST the star, so the
         tail is left behind it: stars fly outward, so the residue drifts back
         toward the vanishing point. (matching their motion puts the tail in
         front of them, which is what looked wrong.) */
  '  vec2 ps=(vUv-c)*asp;' +
  '  float rs=length(ps);' +
  '  float edge=smoothstep(0.13,0.52,rs);' +
  '  vec2 uvStar=c+(ps*(1.0+0.0045*edge))/asp;' +
  /* --- the vortex, close in only. no wrapping: measured across the seam, a
         pixel on one edge is "near" a hole on the other, and the far side of
         the frame gets dragged in over the top of it */
  '  vec2 ph=(vUv-uHole)*asp;' +
  '  float rh=length(ph)+1e-5;' +
  /* the swirl keeps to the well, so it widens as the well does */
  '  float a=uSwirl*0.028/(rh/(uLens*0.40)+1.0);' +
  '  float s=sin(a),co=cos(a);' +
  '  ph=mat2(co,-s,s,co)*ph;' +
  /* same rule close in, but here the residue is pulled toward the hole, so a
     star being fed on trails a thread of itself into the dark */
  '  ph*=1.0+0.030/(rh/(uLens*0.158)+1.0);' +
  '  vec2 uvHole=uHole+ph/asp;' +
  '  float hw=exp(-rh*rh/(uLens*uLens*7.0));' +
  '  vec2 uv=mix(uvStar,uvHole,hw);' +
  '  float decay=mix(mix(0.28,0.66,edge),0.86,hw);' +
  '  vec4 col=texture2D(uPrev,clamp(uv,0.0005,0.9995))*decay;' +
  '  gl_FragColor=vec4(max(col.rgb-0.008,0.0),1.0);' +
  '}';

var VERT_PART =
  'attribute vec2 aPos;attribute float aLum;attribute float aSize;' +
  'varying float vLum;' +
  'void main(){vLum=aLum;gl_PointSize=aSize;gl_Position=vec4(aPos,0.0,1.0);}';

var FRAG_PART =
  'precision mediump float;varying float vLum;' +
  'void main(){' +
  '  vec2 d=gl_PointCoord-0.5;' +
  '  float m=exp(-dot(d,d)*11.0);' +
  '  gl_FragColor=vec4(vec3(vLum*m),1.0);' +
  '}';

/* composite: lensing, refraction, photon ring, shadow. monochrome */
var FRAG_COMP =
  'precision highp float;varying vec2 vUv;' +
  'uniform sampler2D uSrc;uniform vec2 uHole;' +
  'uniform float uAspect,uShadow,uLens,uTime,uSpin,uFlare,uSpark,uWhite,uBang;' +
  'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}' +
  'float samp(vec2 uv){return texture2D(uSrc,clamp(uv,0.0005,0.9995)).g;}' +
  'void main(){' +
  '  vec2 asp=vec2(uAspect,1.0);' +
  '  vec2 p=(vUv-uHole)*asp;' +
  '  float r=length(p)+1e-6;' +
  '  vec2 dir=p/r;' +
  '  float defl=uLens*uLens*1.9/(r*r+uLens*uLens*0.35);' +
  '  defl=min(defl,0.42);' +
  /* nothing out at the border of the page is bent. without this, a well wider
     than the screen drags the far side of the frame in over the edges */
  '  float mx=length(asp)*0.5;' +
  '  float fade=1.0-smoothstep(mx*0.62,mx*0.96,length((vUv-0.5)*asp));' +
  '  defl*=fade;' +
  '  vec2 tang=vec2(-dir.y,dir.x);' +
  '  float drag=uSpin*uLens*uLens*0.55/(r*r+uLens*uLens*0.5)*fade;' +
  '  vec2 base=vUv-(dir*defl-tang*drag)/asp;' +
  '  vec2 off=dir/asp*defl*0.06;' +
  '  float l=samp(base-off)*0.34+samp(base)*0.42+samp(base+off)*0.34;' +
  '  float dr=(r-uShadow*1.5)/(uShadow*0.30);float ring=exp(-dr*dr);' +
  '  float db=(r-uShadow*1.05)/(uShadow*0.7);float back=exp(-db*db);' +
  '  float dop=0.5+0.5*dot(tang,vec2(1.0,0.0))*uSpin;' +
  '  l+=ring*(0.55+0.75*dop)*(1.0+uFlare*1.9);' +
  '  l+=back*0.13*(1.0+uFlare*2.6);' +
  '  float dd=(r-uShadow*3.0)/(uShadow*2.6);float disk=exp(-dd*dd);' +
  '  l+=disk*0.06*(0.6+0.8*dop)*(1.0+uFlare*1.5);' +
  /* the flare itself: a slender line struck through the hole while it feeds */
  '  float fy=p.y/(uShadow*0.28);' +
  '  float fx=p.x/(uShadow*6.0);' +
  '  l+=exp(-fy*fy-fx*fx)*uFlare*1.15;' +
  '  l*=smoothstep(uShadow*0.88,uShadow*1.10,r);' +
  /* while it is still barely there it reads as a plain speck of light */
  '  float sp=r/0.0048;' +
  '  l+=exp(-sp*sp)*uSpark*1.5;' +
  /* the annihilation: a wall of light that falls in on itself */
  '  float br=0.05+0.40*uBang;' +
  '  l+=uBang*uBang*1.9*exp(-r*r/(br*br));' +
  '  l+=(hash(vUv*vec2(1024.0,768.0)+uTime)-0.5)*0.02;' +
  '  l*=1.0-0.42*pow(length((vUv-0.5)*asp)*0.95,2.2);' +
  /* the end. the dark turns over and comes out the other way: a white front
     opens at the hole and runs out past the corners of the page */
  '  float rf=uWhite*mx*1.42;' +
  '  float wm=1.0-smoothstep(rf-mx*0.30,rf,r);' +
  '  l+=(1.0-wm)*uWhite*uWhite*1.6;' +
  '  gl_FragColor=vec4(vec3(mix(l,1.0,wm)),1.0);' +
  '}';

function compile(type, src) {
  var s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  var p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

var progFeed = program(VERT_QUAD, FRAG_FEED);
var progPart = program(VERT_PART, FRAG_PART);
var progComp = program(VERT_QUAD, FRAG_COMP);

var quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

/* ------------------------------------------------------------ framebuffers */

var fbo = [null, null], tex = [null, null], cur = 0;

function makeTarget(i) {
  if (tex[i]) { gl.deleteTexture(tex[i]); gl.deleteFramebuffer(fbo[i]); }
  var t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  var f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  tex[i] = t; fbo[i] = f;
}

function clearTargets() {
  for (var i = 0; i < 2; i++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[i]);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function resize() {
  W = Math.floor(window.innerWidth * DPR);
  H = Math.floor(window.innerHeight * DPR);
  canvas.width = W; canvas.height = H;
  makeTarget(0); makeTarget(1);
  web.resize();
}
window.addEventListener('resize', resize);

/* ------------------------------------------------------------------ noise */

var PERM = new Uint8Array(512);
(function () {
  var p = [], i;
  for (i = 0; i < 256; i++) p[i] = i;
  for (i = 255; i > 0; i--) { var j = (Math.random()*(i+1))|0, t = p[i]; p[i] = p[j]; p[j] = t; }
  for (i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function fade(t) { return t*t*t*(t*(t*6-15)+10); }
function grad(h, x, y) {
  switch (h & 3) { case 0: return x + y; case 1: return -x + y; case 2: return x - y; default: return -x - y; }
}
function noise2(x, y) {
  var X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  x -= Math.floor(x); y -= Math.floor(y);
  var u = fade(x), v = fade(y);
  var A = PERM[X] + Y, B = PERM[X+1] + Y;
  return (1-v)*((1-u)*grad(PERM[A],x,y)   + u*grad(PERM[B],x-1,y)) +
             v*((1-u)*grad(PERM[A+1],x,y-1) + u*grad(PERM[B+1],x-1,y-1));
}
var EPS = 0.35;
function curl(x, y, out) {
  out[0] =  (noise2(x, y + EPS) - noise2(x, y - EPS)) / (2*EPS);
  out[1] = -(noise2(x + EPS, y) - noise2(x - EPS, y)) / (2*EPS);
}

/* the hand can be picked up on one side of the page and put down on the other;
   this keeps that from reading as a throw */
function wrap(d) { return d - Math.round(d); }

/* ------------------------------------------------------------------ bodies

   roles:  PLAIN     a lone star, drifts by on its own
           LEAD      the anchor of a constellation, carries its depth
           MEMBER    a star pinned at a fixed offset from its LEAD
           SUN       the anchor of a little solar system
           PLANET    a small dot circling its SUN
   any of them can be captured, at which point it leaves its group behind. */

var PLAIN = 0, LEAD = 1, MEMBER = 2, SUN = 3, PLANET = 4;
var STAR = 0, CAUGHT = 1;

var SYSTEMS = 46, PLANETS_PER = 3;
var CONSTS  = 16, STARS_PER  = 7;
var SYS_SLOTS = SYSTEMS * (1 + PLANETS_PER);
var CON_SLOTS = CONSTS * STARS_PER;
/* as many as the machine will stand: the annihilation needs the room */
var COUNT = (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ||
             window.innerWidth * window.innerHeight < 380000) ? 7000 : 14000;

var state  = new Uint8Array(COUNT);
var role   = new Uint8Array(COUNT);
var lead   = new Int32Array(COUNT);      /* index of the group anchor */
var ox     = new Float32Array(COUNT);    /* offset from the anchor, world units */
var oy     = new Float32Array(COUNT);
var orbR   = new Float32Array(COUNT);    /* planets: orbit radius and phase */
var orbP   = new Float32Array(COUNT);
var orbS   = new Float32Array(COUNT);
var sx = new Float32Array(COUNT), sy = new Float32Array(COUNT), sz = new Float32Array(COUNT);
var px = new Float32Array(COUNT), py = new Float32Array(COUNT);
var vx = new Float32Array(COUNT), vy = new Float32Array(COUNT);
var mag  = new Float32Array(COUNT);
var seed = new Float32Array(COUNT);

var verts = new Float32Array(COUNT * 4);
var vbuf = gl.createBuffer();

var FOV = 0.30, NEAR = 0.06, FAR = 3.2;

function placeAnchor(i, deep) {
  var a = Math.random() * Math.PI * 2;
  var d = 0.15 + Math.random() * 1.5;
  sx[i] = Math.cos(a) * d;
  sy[i] = Math.sin(a) * d;
  sz[i] = deep ? FAR * (0.55 + Math.random() * 0.45) : NEAR + Math.random() * (FAR - NEAR);
  seed[i] = Math.random() * 1000;
  state[i] = STAR;
}

function bornPlain(i, deep) {
  placeAnchor(i, deep);
  role[i] = PLAIN; lead[i] = i;
  mag[i] = 0.24 + Math.random() * 0.70;
}

/* a constellation: one anchor and a handful of stars in a fixed figure */
function bornConstellation(c, deep) {
  var base = SYS_SLOTS + c * STARS_PER;
  placeAnchor(base, deep);
  role[base] = LEAD; lead[base] = base;
  mag[base] = 0.48 + Math.random() * 0.5;
  ox[base] = 0; oy[base] = 0;
  var spread = 0.10 + Math.random() * 0.22;
  for (var k = 1; k < STARS_PER; k++) {
    var i = base + k;
    role[i] = MEMBER; lead[i] = base; state[i] = STAR;
    ox[i] = (Math.random()*2-1) * spread;
    oy[i] = (Math.random()*2-1) * spread;
    mag[i] = 0.34 + Math.random() * 0.52;
    seed[i] = Math.random() * 1000;
  }
}

/* a solar system: a bright sun with small dots going round it */
function bornSystem(s, deep) {
  var base = s * (1 + PLANETS_PER);
  placeAnchor(base, deep);
  role[base] = SUN; lead[base] = base;
  mag[base] = 0.9 + Math.random() * 0.2;
  for (var k = 1; k <= PLANETS_PER; k++) {
    var i = base + k;
    role[i] = PLANET; lead[i] = base; state[i] = STAR;
    orbR[i] = 0.020 + k * 0.016 + Math.random() * 0.008;
    orbP[i] = Math.random() * Math.PI * 2;
    orbS[i] = (0.55 - k * 0.12) * (Math.random() < 0.5 ? 1 : -1);
    mag[i] = 0.38 + Math.random() * 0.28;
    seed[i] = Math.random() * 1000;
  }
}

function rebirth(i, deep) {
  /* whatever it was, put its whole group back out in the deep */
  var l = lead[i];
  if (role[l] === SUN) bornSystem(l / (1 + PLANETS_PER) | 0, deep);
  else if (role[l] === LEAD) bornConstellation((l - SYS_SLOTS) / STARS_PER | 0, deep);
  else bornPlain(i, deep);
}

var hole = { x: 0.5, y: 0.5, vx: 0, vy: 0 };
var target = { x: 0.5, y: 0.5 };
var dragging = false, spin = 1;
var captureFlash = 0, consuming = 0, flare = 0;
var bangT = 0, bangFlash = 0;

/* off a wall, the drone goes up onto the next step of the ladder */
var STEPS = [0, 0.5, -0.5, 1, -1, 1.5];
var stepAt = 0, jump = 1, bounced = false;

function capture(i, x, y) {
  state[i] = CAUGHT;
  px[i] = x; py[i] = y;
  var dx = (x - hole.x) * (W / H), dy = y - hole.y;
  var r = Math.sqrt(dx*dx + dy*dy) || 1e-4;
  var orbit = Math.sqrt(GRAV / (r + 0.01 * S)) * (0.92 + Math.random() * 0.16);
  vx[i] = -dy / r * orbit / (W/H) + (Math.random()-0.5) * 0.0002 * S;
  vy[i] =  dx / r * orbit + (Math.random()-0.5) * 0.0002 * S;
  captureFlash = Math.min(captureFlash + (role[i] === SUN ? 1.8 : 0.35), 40);
}

(function seedSky() {
  for (var s = 0; s < SYSTEMS; s++) bornSystem(s, false);
  for (var c = 0; c < CONSTS; c++) bornConstellation(c, false);
  for (var i = SYS_SLOTS + CON_SLOTS; i < COUNT; i++) bornPlain(i, false);
})();

/* ------------------------------------------------------------- the pointer */

var lastPtr = { x: 0.5, y: 0.5, t: 0 }, ptrVel = { x: 0, y: 0 };
/* the first finger down owns the hole; the rest are ignored until it lifts,
   or two of them fight over the target and the whole thing shakes apart */
var ptrId = null;

function pointer(e) {
  var t = e.touches ? e.touches[0] : e;
  var nx = t.clientX / window.innerWidth;
  var ny = 1 - t.clientY / window.innerHeight;
  var now = performance.now();
  var dt = Math.max(now - lastPtr.t, 1);
  ptrVel.x = ptrVel.x * 0.6 + wrap(nx - lastPtr.x) / dt * 0.4;
  ptrVel.y = ptrVel.y * 0.6 + wrap(ny - lastPtr.y) / dt * 0.4;
  lastPtr.x = nx; lastPtr.y = ny; lastPtr.t = now;
  target.x = nx; target.y = ny;
}
canvas.addEventListener('pointerdown', function (e) {
  if (ptrId !== null) return;
  ptrId = e.pointerId;
  dragging = true; ptrVel.x = ptrVel.y = 0;
  lastPtr.t = performance.now(); lastPtr.x = target.x; lastPtr.y = target.y;
  pointer(e);
  if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  flare += 0.45;                       /* a little pulse of appetite */
  audio.start(); audio.resume();
});
canvas.addEventListener('pointermove', function (e) {
  if (dragging && e.pointerId === ptrId) pointer(e);
});
function release(e) {
  if (e.pointerId !== ptrId) return;
  ptrId = null;
  if (!dragging) return;
  dragging = false;
  /* let go while moving and it sails off, wrapping round the screen */
  hole.vx += ptrVel.x * 9; hole.vy += ptrVel.y * 9;
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

/* ------------------------------------------------------------------ audio */

var audio = (function () {
  var ctx = null, started = false, done = false;
  var droneA, droneB, sub, hum, lp, bp, noiseGain, pan, master, droneGain;

  var ROOT = 29.135;          /* B flat */
  var BEAT = 1 / 62;
  var MICROTONE = 0.13;       /* about three quarters of a semitone either way */

  /* the whistle the explosion leaves in the ears, and the ladder of notes that
     hangs off the underside of it. eight steps, in cents below the whistle: a
     major seventh stacked twice over, every step of it bent off true, so it
     lands somewhere between a pelog scale and a piano nobody has tuned. the
     first knot is the top of the ladder and each one after it fills in lower. */
  var TINN = 2317;
  var PELOG = [-2288, -2749, -3113, -3492, -3866, -4271, -4590, -4986];
  /* the eighth note lands off true like the rest of them, and then, over the
     length of the haul, slides down onto the root the whole chord is leaning
     against: the same pitch as the fourth step, two octaves under it */
  var ROOTNOTE = -5888;

  var tinnOsc = null, tinnGain = null, chord = [];

  function noiseBuffer(c) {
    var len = c.sampleRate * 3, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (Math.random() < 0.006 ? 1 : 0.2);
    return b;
  }

  function start() {
    if (started || done) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    started = true;
    ctx = new AC();
    /* made inside a gesture and still born asleep, on a good few phones. it has
       to be woken by hand, and woken again on every touch after that, or the
       clock never starts and nothing that was scheduled ever plays */
    resume();

    master = ctx.createGain(); master.gain.value = 0;
    pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    if (pan) { master.connect(pan); pan.connect(ctx.destination); }
    else master.connect(ctx.destination);

    lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 120; lp.Q.value = 4;
    lp.connect(master);

    droneA = ctx.createOscillator(); droneA.type = 'sawtooth'; droneA.frequency.value = ROOT;
    droneB = ctx.createOscillator(); droneB.type = 'sawtooth'; droneB.frequency.value = ROOT + BEAT;
    droneGain = ctx.createGain(); droneGain.gain.value = 0.22;
    droneA.connect(droneGain); droneB.connect(droneGain); droneGain.connect(lp);
    droneA.start(); droneB.start();

    /* the body of the thing: root sine, plus a hum an octave under it */
    sub = ctx.createOscillator(); sub.type = 'sine'; sub.frequency.value = ROOT;
    var sg = ctx.createGain(); sg.gain.value = 0.30;
    sub.connect(sg); sg.connect(master); sub.start();

    hum = ctx.createOscillator(); hum.type = 'sine'; hum.frequency.value = ROOT * 0.5;
    var hg = ctx.createGain(); hg.gain.value = 0.34;
    hum.connect(hg); hg.connect(master); hum.start();

    /* the pulse: one breath every seventy-odd seconds, nothing faster */
    var lfoF = ctx.createOscillator(); lfoF.type = 'sine'; lfoF.frequency.value = 1 / 74;
    var lfoFg = ctx.createGain(); lfoFg.gain.value = 70;
    lfoF.connect(lfoFg); lfoFg.connect(lp.frequency); lfoF.start();

    var lfoA = ctx.createOscillator(); lfoA.type = 'sine'; lfoA.frequency.value = 1 / 93;
    var lfoAg = ctx.createGain(); lfoAg.gain.value = 0.07;
    lfoA.connect(lfoAg); lfoAg.connect(droneGain.gain); lfoA.start();

    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx); src.loop = true;
    bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1400; bp.Q.value = 0.7;
    noiseGain = ctx.createGain(); noiseGain.gain.value = 0.05;
    src.connect(bp); bp.connect(noiseGain); noiseGain.connect(master);
    src.start();

    master.gain.setValueAtTime(0.0001, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 5);
  }

  function resume() {
    if (ctx && ctx.state === 'suspended' && ctx.resume) {
      var r = ctx.resume();
      if (r && r.catch) r.catch(function () {});
    }
  }

  function update(hx, hy, eat, bending, jump, grown) {
    if (!started || !ctx || done) return;
    var t = ctx.currentTime;
    /* the bend follows the hand while dragging, and drifts back slowly after */
    var f = ROOT * jump * Math.pow(2, (hy - 0.5) * MICROTONE);
    var k = bending ? 0.25 : 5;
    droneA.frequency.setTargetAtTime(f, t, k);
    droneB.frequency.setTargetAtTime(f + BEAT, t, k);
    sub.frequency.setTargetAtTime(f, t, k);
    hum.frequency.setTargetAtTime(f * 0.5, t, k);
    lp.frequency.setTargetAtTime(85 + hx * 300, t, 4);
    bp.frequency.setTargetAtTime(500 + hx * 2600, t, 3);
    if (pan) pan.pan.setTargetAtTime((hx - 0.5) * 1.4, t, 3);
    /* the crackle never leaves; it thickens as it feeds and as the thing grows */
    noiseGain.gain.setTargetAtTime(0.05 + grown * 0.11 + Math.min(eat, 1) * 0.30, t, 0.35);
  }

  /* the whistle. it comes up under the tail of the blast and stays for as long
     as the white does, wandering a couple of cents either way like a real one */
  function tinnitus(at) {
    if (!ctx || tinnOsc) return;
    tinnOsc = ctx.createOscillator(); tinnOsc.type = 'sine';
    tinnOsc.frequency.value = TINN;
    tinnGain = ctx.createGain();
    tinnGain.gain.setValueAtTime(0.0001, at);
    tinnGain.gain.exponentialRampToValueAtTime(0.030, at + 2.6);
    var lf = ctx.createOscillator(); lf.type = 'sine'; lf.frequency.value = 1 / 11;
    var lg = ctx.createGain(); lg.gain.value = 3.5;
    lf.connect(lg); lg.connect(tinnOsc.frequency); lf.start(at);
    tinnOsc.connect(tinnGain); tinnGain.connect(ctx.destination);
    tinnOsc.start(at);
  }

  /* the explosion: the drone is cut, a wall of noise and a sub thump go off
     together, and the noise is wiped upward off the top of the range until
     there is nothing left of it but the whistle */
  function blast() {
    if (!started || !ctx || done) return;
    done = true;
    var t = ctx.currentTime;

    droneGain.gain.cancelScheduledValues(t);
    droneGain.gain.setTargetAtTime(0.0001, t, 0.09);
    noiseGain.gain.cancelScheduledValues(t);
    noiseGain.gain.setTargetAtTime(0.0001, t, 0.12);
    master.gain.cancelScheduledValues(t);
    master.gain.setTargetAtTime(0.0001, t + 0.22, 0.14);

    /* the white is gone in under a second but the sound of it is not: the
       noise is walked up out of the bottom of the range over four seconds and
       comes to rest on the whistle, which is all that is left of it */
    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx); src.loop = true;
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.Q.value = 2.4;
    hp.frequency.setValueAtTime(34, t);
    hp.frequency.exponentialRampToValueAtTime(240, t + 0.9);
    hp.frequency.exponentialRampToValueAtTime(TINN * 0.92, t + 4.0);
    var bpk = ctx.createBiquadFilter(); bpk.type = 'peaking';
    bpk.frequency.value = TINN; bpk.Q.value = 3.5;
    bpk.gain.setValueAtTime(0, t);
    bpk.gain.linearRampToValueAtTime(14, t + 4.0);   /* the whistle picked out */
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(0.95, t + 0.025);
    ng.gain.setTargetAtTime(0.30, t + 0.5, 1.1);
    ng.gain.setTargetAtTime(0.0001, t + 4.2, 0.9);
    src.connect(hp); hp.connect(bpk); bpk.connect(ng); ng.connect(ctx.destination);
    src.start(t); src.stop(t + 8);

    var thud = ctx.createOscillator(); thud.type = 'sine';
    thud.frequency.setValueAtTime(124, t);
    thud.frequency.exponentialRampToValueAtTime(23, t + 0.45);
    var tg = ctx.createGain();
    tg.gain.setValueAtTime(0.0001, t);
    tg.gain.exponentialRampToValueAtTime(0.85, t + 0.02);
    tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    thud.connect(tg); tg.connect(ctx.destination);
    thud.start(t); thud.stop(t + 0.9);

    tinnitus(t + 2.6);          /* it comes up under the tail of the sweep */
  }

  /* the annihilation. a charge going off, and then a long fall: the noise is
     filtered downward until it is nothing but a deep rumble, and what is left
     under it when that goes is the hiss and the sub of the black hole again */
  function wake() {
    if (!started || !ctx) { start(); return; }
    var t = ctx.currentTime;

    /* the chord and the whistle are pulled down into it */
    for (var i = 0; i < chord.length; i++) {
      var c = chord[i];
      c.g.gain.cancelScheduledValues(t);
      c.g.gain.setTargetAtTime(0.0001, t, 0.20);
      c.o.stop(t + 2.4); c.o2.stop(t + 2.4);
    }
    chord.length = 0;
    if (tinnGain) {
      tinnGain.gain.cancelScheduledValues(t);
      tinnGain.gain.setTargetAtTime(0.0001, t, 0.30);
      tinnOsc.stop(t + 3.0); tinnOsc = null; tinnGain = null;
    }

    var src = ctx.createBufferSource();
    src.buffer = noiseBuffer(ctx); src.loop = true;
    var lpb = ctx.createBiquadFilter(); lpb.type = 'lowpass'; lpb.Q.value = 3.2;
    lpb.frequency.setValueAtTime(9000, t);
    lpb.frequency.exponentialRampToValueAtTime(46, t + 2.8);
    var ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.exponentialRampToValueAtTime(1.0, t + 0.04);    /* the oomph */
    ng.gain.setTargetAtTime(0.45, t + 0.22, 0.8);
    ng.gain.setTargetAtTime(0.0001, t + 3.6, 1.2);
    src.connect(lpb); lpb.connect(ng); ng.connect(ctx.destination);
    src.start(t); src.stop(t + 8);

    var boom = ctx.createOscillator(); boom.type = 'sine';
    boom.frequency.setValueAtTime(88, t);
    boom.frequency.exponentialRampToValueAtTime(25, t + 1.2);
    var bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.exponentialRampToValueAtTime(0.9, t + 0.03);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    boom.connect(bg); bg.connect(ctx.destination);
    boom.start(t); boom.stop(t + 2.6);

    /* the bed comes back up underneath the rumble as it goes */
    done = false;
    droneGain.gain.cancelScheduledValues(t);
    droneGain.gain.setValueAtTime(0.0001, t);
    droneGain.gain.setTargetAtTime(0.22, t + 1.2, 1.5);
    noiseGain.gain.cancelScheduledValues(t);
    noiseGain.gain.setValueAtTime(0.0001, t);
    noiseGain.gain.setTargetAtTime(0.05, t + 1.4, 1.7);
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(0.0001, t);
    master.gain.linearRampToValueAtTime(0.9, t + 2.8);
  }

  /* a knot tied: one low note off the ladder, held. they do not decay, so by
     the eighth the whole chord is standing there under the whistle */
  function knot(n) {
    if (!started) start();
    if (!ctx) return;
    var t = ctx.currentTime;
    tinnitus(t);
    var last = (n >= PELOG.length);
    var f = TINN * Math.pow(2, PELOG[Math.min(n, PELOG.length) - 1] / 1200);
    var o  = ctx.createOscillator(); o.type  = 'triangle'; o.frequency.value = f;
    var o2 = ctx.createOscillator(); o2.type = 'sine';
    o2.frequency.value = f * Math.pow(2, 1.1 / 1200);   /* a hair sharp, so it beats */
    var lpk = ctx.createBiquadFilter(); lpk.type = 'lowpass';
    lpk.frequency.value = f * 4.5; lpk.Q.value = 0.7;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(last ? 0.115 : 0.075, t + 0.55);
    if (last) {
      /* it arrives wonky with the rest of them and then settles, slowly, onto
         the note the chord has been asking for the whole way down */
      var fr = TINN * Math.pow(2, ROOTNOTE / 1200);
      o.frequency.setValueAtTime(f, t + 0.9);
      o.frequency.exponentialRampToValueAtTime(fr, t + 5.0);
      o2.frequency.setValueAtTime(f * Math.pow(2, 1.1 / 1200), t + 0.9);
      o2.frequency.exponentialRampToValueAtTime(fr * Math.pow(2, 1.1 / 1200), t + 5.0);
      lpk.frequency.setValueAtTime(f * 4.5, t + 0.9);
      lpk.frequency.exponentialRampToValueAtTime(fr * 7.0, t + 5.0);
    }
    o.connect(lpk); o2.connect(lpk); lpk.connect(g); g.connect(ctx.destination);
    o.start(t); o2.start(t);
    chord.push({ o: o, o2: o2, g: g });
  }

  return { start: start, resume: resume, update: update,
           blast: blast, wake: wake, knot: knot };
})();

document.addEventListener('keydown', function (e) {
  if (e.key === ' ') { audio.start(); audio.resume(); }
});

/* ------------------------------------------------------------------- loop */

var c2 = [0, 0], time = 0;

function tick(ms) {
  requestAnimationFrame(tick);
  var now = ms * 0.001;
  var dt = Math.min(now - time, 0.05) || 0.016;
  time = now;
  if (phase === SPACE) space(dt); else web.step(dt);
}

function space(dt) {
  /* ---- it grows. slowly on its own, faster on what it has eaten */
  grow = Math.min(1, grow + dt / GROW_SECONDS + Math.min(consuming, 1.4) * dt * 0.0042);
  S = S_START * Math.pow(S_END / S_START, grow);
  R_SHADOW = R_SHADOW0 * S;
  R_LENS   = R_LENS0   * S;
  GRAV     = GRAV0 * S * S * S;
  CAPTURE  = CAPTURE0 * S;
  CAPTURE_Z = 1.8 + grow * 1.35;
  var spark = Math.pow(Math.max(0, 1 - grow / 0.25), 1.5);

  var aspect = W / H;
  var halfDiag = Math.sqrt(aspect*aspect + 1) * 0.5;

  if (dragging) {
    hole.vx = hole.vx * 0.965 + (target.x - hole.x) * 0.0016;
    hole.vy = hole.vy * 0.965 + (target.y - hole.y) * 0.0016;
  } else {
    hole.vx *= 0.994; hole.vy *= 0.994;
  }
  hole.x += hole.vx; hole.y += hole.vy;
  /* it stays on the page. nothing wraps any more, so being thrown off one side
     and reappearing on the other is a hard cut now rather than the seamless
     thing it used to be. it is thrown at the wall instead, and bounces; the
     bigger it is the further in the wall stands, so the shadow is never half
     over an edge. a bounce knocks the drone onto the next step of the ladder,
     the way crossing an edge used to. */
  var mgx = Math.min(0.45, 0.02 + R_SHADOW * 1.5 / aspect);
  var mgy = Math.min(0.45, 0.02 + R_SHADOW * 1.5);
  var hit = false;
  if (hole.x < mgx)     { hole.x = mgx;     hole.vx = Math.abs(hole.vx) * 0.55; hit = true; }
  if (hole.x > 1 - mgx) { hole.x = 1 - mgx; hole.vx = -Math.abs(hole.vx) * 0.55; hit = true; }
  if (hole.y < mgy)     { hole.y = mgy;     hole.vy = Math.abs(hole.vy) * 0.55; hit = true; }
  if (hole.y > 1 - mgy) { hole.y = 1 - mgy; hole.vy = -Math.abs(hole.vy) * 0.55; hit = true; }
  if (hit && !bounced) {
    stepAt = (stepAt + 1) % STEPS.length;
    jump = Math.pow(2, STEPS[stepAt] / 12);
  }
  bounced = hit;

  bangT = Math.max(0, bangT - dt);
  bangFlash = Math.max(0, bangFlash - dt * 1.4);
  var boost = bangT * 0.2;                 /* the debris runs bright and fat */

  var speed = Math.sqrt(hole.vx*hole.vx + hole.vy*hole.vy);
  captureFlash *= 0.94;
  consuming += (Math.min(captureFlash * 0.5, 1.4) - consuming) * 0.06;
  /* mostly dark; it brightens when prodded, when moving, and when feeding */
  flare = flare * 0.93 + consuming * 0.020 + Math.min(speed * 55, 0.5) * 0.030;
  if (flare > 0.9) flare = 0.9;
  audio.update(hole.x, hole.y, consuming, dragging, jump, grow);

  /* ---- the end comes when the well is wider than the page: any further and
     the lens is bending in pixels from the far side of the screen */
  if (!ending && R_LENS * 1.35 >= halfDiag) { ending = true; audio.blast(); }
  if (ending) {
    endT += dt;
    var w = Math.min(1, endT / WHITEOUT);
    /* it goes off, rather than fading up: nearly all of it in the first third */
    white = 1 - Math.pow(1 - w, 3.2);
    if (endT >= WHITEOUT + 0.10) { web.enter(); return; }
  }

  for (var i = 0; i < COUNT; i++) {
    var o = i * 4, x, y, lum, size, r = 1;

    if (state[i] === STAR) {
      var l = lead[i], wx, wy, wz;

      if (l === i) {
        /* anchors carry the depth; everything else rides along */
        sz[i] -= dt * 0.055;
        if (sz[i] < NEAR) { rebirth(i, true); }
        wx = sx[i]; wy = sy[i]; wz = sz[i];
      } else if (role[i] === PLANET) {
        orbP[i] += orbS[i] * dt;
        wx = sx[l] + Math.cos(orbP[i]) * orbR[i];
        wy = sy[l] + Math.sin(orbP[i]) * orbR[i] * 0.45;   /* seen near edge-on */
        wz = sz[l];
      } else {
        wx = sx[l] + ox[i]; wy = sy[l] + oy[i]; wz = sz[l];
      }

      if (wz < NEAR) { verts[o] = -2; verts[o+1] = -2; verts[o+2] = 0; verts[o+3] = 1; continue; }
      var iz = 1 / wz;
      x = 0.5 + wx * iz * FOV / aspect;
      y = 0.5 + wy * iz * FOV;
      if (x < -0.4 || x > 1.4 || y < -0.4 || y > 1.4) {
        if (l === i) rebirth(i, true);
        verts[o] = -2; verts[o+1] = -2; verts[o+2] = 0; verts[o+3] = 1; continue;
      }

      if (wz < CAPTURE_Z) {
        var ddx = (x - hole.x) * aspect, ddy = y - hole.y;
        if (ddx*ddx + ddy*ddy < CAPTURE*CAPTURE) { capture(i, x, y); continue; }
      }

      lum = mag[i] * Math.min(1, iz * 0.72) * (0.78 + 0.22 * Math.sin(time * 0.7 + seed[i]));
      size = (role[i] === SUN ? 2.6 : role[i] === PLANET ? 0.9 : 1.15) * (0.75 + iz * 0.5) * DPR;
    } else {
      var dx = (hole.x - px[i]) * aspect, dy = hole.y - py[i];
      var r2 = dx*dx + dy*dy; r = Math.sqrt(r2) + 1e-5;
      var ux = dx / r, uy = dy / r;

      var g = GRAV / (r2 + 0.0009 * S * S);
      vx[i] += ux / aspect * g; vy[i] += uy * g;

      curl(px[i]*3.4 + seed[i]*0.01, py[i]*3.4 + time*0.05, c2);
      var turb = 0.0000060 * S * Math.min(1, r / (0.25 * S));
      vx[i] += c2[0] * turb; vy[i] += c2[1] * turb;

      vx[i] *= 0.9995; vy[i] *= 0.9995;
      px[i] += vx[i]; py[i] += vy[i];
      /* debris thrown clear of the page does not come round the other side:
         it is a star again, and a long way off */
      if (px[i] < 0 || px[i] >= 1 || py[i] < 0 || py[i] >= 1) {
        rebirth(i, true); continue;
      }

      if (r < R_SHADOW * 0.85) {
        captureFlash = Math.min(captureFlash + (role[i] === SUN ? 2.2 : 0.5), 40);
        flare = Math.min(flare + (role[i] === SUN ? 0.10 : 0.012), 0.9);
        rebirth(i, true); continue;
      }
      if (r > Math.max(0.62, R_SHADOW * 1.5) + bangT * 0.42) { rebirth(i, true); continue; }

      x = px[i]; y = py[i];
      var sp = Math.abs(vx[i]) + Math.abs(vy[i]);
      var near = Math.min(1, R_LENS * 1.4 / r);
      lum = Math.min(1.6, mag[i] * (0.5 + near * 1.5) * (1 + boost * 0.6) + sp * 120);
      size = (0.9 + near * 3.0) * DPR * (1 + boost * 1.2);
    }

    verts[o]   = x * 2 - 1;
    verts[o+1] = y * 2 - 1;
    verts[o+2] = lum;
    verts[o+3] = size;
  }

  /* ---- feedback */
  var src = cur, dst = 1 - cur;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[dst]);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(progFeed);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  var aQ = gl.getAttribLocation(progFeed, 'aPos');
  gl.enableVertexAttribArray(aQ); gl.vertexAttribPointer(aQ, 2, gl.FLOAT, false, 0, 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[src]);
  gl.uniform1i(gl.getUniformLocation(progFeed, 'uPrev'), 0);
  gl.uniform2f(gl.getUniformLocation(progFeed, 'uHole'), hole.x, hole.y);
  gl.uniform1f(gl.getUniformLocation(progFeed, 'uAspect'), aspect);
  gl.uniform1f(gl.getUniformLocation(progFeed, 'uSwirl'), spin);
  gl.uniform1f(gl.getUniformLocation(progFeed, 'uLens'), R_LENS);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);

  /* ---- bodies */
  gl.useProgram(progPart);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbuf);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
  var aP = gl.getAttribLocation(progPart, 'aPos');
  var aL = gl.getAttribLocation(progPart, 'aLum');
  var aS = gl.getAttribLocation(progPart, 'aSize');
  gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 16, 0);
  gl.enableVertexAttribArray(aL); gl.vertexAttribPointer(aL, 1, gl.FLOAT, false, 16, 8);
  gl.enableVertexAttribArray(aS); gl.vertexAttribPointer(aS, 1, gl.FLOAT, false, 16, 12);
  gl.drawArrays(gl.POINTS, 0, COUNT);

  /* ---- composite */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.BLEND);
  gl.useProgram(progComp);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  var aQ2 = gl.getAttribLocation(progComp, 'aPos');
  gl.enableVertexAttribArray(aQ2); gl.vertexAttribPointer(aQ2, 2, gl.FLOAT, false, 0, 0);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[dst]);
  gl.uniform1i(gl.getUniformLocation(progComp, 'uSrc'), 0);
  gl.uniform2f(gl.getUniformLocation(progComp, 'uHole'), hole.x, hole.y);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uAspect'), aspect);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uShadow'), R_SHADOW);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uLens'), R_LENS);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uTime'), time);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uSpin'), spin);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uFlare'), flare);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uSpark'), spark);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uWhite'), white);
  gl.uniform1f(gl.getUniformLocation(progComp, 'uBang'), bangFlash);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  cur = dst;
}

/* ---------------------------------------------------------------- the bang

   everything the spider gathered, let go of at once, from wherever she was
   standing. what flies far enough out stops being debris and is a star again,
   and what is left in the middle is a speck of light with an appetite.      */

function bang(nx, ny) {
  hole.x = nx; hole.y = ny; hole.vx = 0; hole.vy = 0;
  target.x = nx; target.y = ny; dragging = false;

  grow = 0; S = S_START;
  R_SHADOW = R_SHADOW0 * S; R_LENS = R_LENS0 * S;
  GRAV = GRAV0 * S * S * S; CAPTURE = CAPTURE0 * S; CAPTURE_Z = 1.8;
  ending = false; endT = 0; white = 0;
  captureFlash = 0; consuming = 0; flare = 0.9;
  bangT = 5; bangFlash = 1;
  clearTargets();

  var asp = W / H;
  for (var i = 0; i < COUNT; i++) {
    state[i] = CAUGHT;                 /* roles are left alone: the groups keep
                                          their shape and come back whole */
    var a = Math.random() * Math.PI * 2;
    var sp = 0.0012 + Math.pow(Math.random(), 2.0) * 0.011;
    /* on a small ball around it, never on it: anything sitting exactly on the
       shadow is eaten on the first frame and comes back as a far-off star */
    var r0 = 0.004 + Math.random() * 0.013;
    px[i] = Math.min(0.999, Math.max(0.001, nx + Math.cos(a) * r0 / asp));
    py[i] = Math.min(0.999, Math.max(0.001, ny + Math.sin(a) * r0));
    vx[i] = Math.cos(a) * sp / asp;
    vy[i] = Math.sin(a) * sp;
    mag[i] = 0.55 + Math.random() * 0.9;
    seed[i] = Math.random() * 1000;
  }
  audio.wake();
}

/* --------------------------------------------------------------- the white

   the far side of the whiteout. a spider the size of a full stop goes about
   tying the specks of matter that float there; a tied speck darkens and stays
   where it is put. drag a speck to her to feed her, or drag it out of her
   way. eight knots and the web hauls itself in.                             */

var web = (function () {
  var cv = document.getElementById('w');
  var g = cv.getContext('2d');

  var WALK = 0, TIE = 1, HAUL = 2;
  var NEEDED = 8, MOTES = 18;
  var TWO = Math.PI * 2;

  var motes = [], strands = [], tied = 0;
  var spider = { x:0, y:0, a:0, step:0, state:WALK, hold:0, prey:-1 };

  /* eight legs, each one with a foot of its own that stays where it is put.
     a foot is only picked up when the body has walked far enough off it, and
     while it is in the air the knee rides high; that is the whole gait. */
  var REST  = [0.62, 1.22, 1.98, 2.62];      /* where each leg sits, front to back */
  var REACH = [14.5, 16.0, 15.0, 12.5];      /* and how far out */
  var legs = [];
  for (var _s = -1; _s <= 1; _s += 2)
    for (var _k = 0; _k < 4; _k++)
      legs.push({ s:_s, k:_k, x:0, y:0, fx:0, fy:0, tx:0, ty:0, up:0, w:(_k * 0.5 + (_s > 0 ? 0.25 : 0)) });
  var grab = -1, ptr = { x:0, y:0, down:false, id:null };
  var t = 0, blackT = -1, U = 1, taut = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function footIdeal(L, out) {
    /* never quite still: even stopped, the feet fidget a little */
    var an = spider.a + L.s * REST[L.k] + Math.sin(t * 1.1 + L.w * 5.1) * 0.045;
    var re = (REACH[L.k] + Math.sin(t * 0.9 + L.w * 3.7) * 0.5) * U;
    out[0] = spider.x + Math.cos(an) * re;
    out[1] = spider.y + Math.sin(an) * re;
  }

  var _fi = [0, 0];
  function plantFeet() {
    for (var i = 0; i < legs.length; i++) {
      footIdeal(legs[i], _fi);
      legs[i].x = legs[i].fx = _fi[0]; legs[i].y = legs[i].fy = _fi[1];
      legs[i].up = 0;
    }
  }

  /* the feet. no more than three off the ground at once, and never both of a
     pair, so there is always something under her */
  function walkLegs(dt) {
    var lifted = 0, i, L;
    for (i = 0; i < legs.length; i++) if (legs[i].up > 0) lifted++;
    for (i = 0; i < legs.length; i++) {
      L = legs[i];
      if (L.up > 0) {
        L.up = Math.max(0, L.up - dt * 3.4);
        var q = 1 - L.up;                        /* 0 at lift, 1 at touchdown */
        var e = q * q * (3 - 2 * q);
        L.x = L.fx + (L.tx - L.fx) * e;
        L.y = L.fy + (L.ty - L.fy) * e;
        continue;
      }
      footIdeal(L, _fi);
      var dx = _fi[0] - L.x, dy = _fi[1] - L.y;
      if (dx*dx + dy*dy > (7.5 * U) * (7.5 * U) && lifted < 3 &&
          legs[(i + 4) % 8].up <= 0) {
        L.fx = L.x; L.fy = L.y;
        /* she puts it down a little ahead of where it wanted to go */
        L.tx = _fi[0] + Math.cos(spider.a) * 3.4 * U + rand(-1.4, 1.4) * U;
        L.ty = _fi[1] + Math.sin(spider.a) * 3.4 * U + rand(-1.4, 1.4) * U;
        L.up = 1; lifted++;
      }
    }
  }

  function nearestFree(x, y, within) {
    var best = -1, bd = within ? within * within : 1e12;
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i]; if (m.tied) continue;
      var dx = m.x - x, dy = m.y - y, d = dx*dx + dy*dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function nearestTied(skip) {
    var s = motes[skip], best = -1, bd = 1e12;
    for (var i = 0; i < motes.length; i++) {
      if (i === skip || !motes[i].tied) continue;
      var dx = motes[i].x - s.x, dy = motes[i].y - s.y, d = dx*dx + dy*dy;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function enter() {
    phase = WEB;
    canvas.style.display = 'none';
    cv.style.display = 'block';
    layout();
    motes.length = 0; strands.length = 0;
    tied = 0; t = 0; blackT = -1; taut = 0; grab = -1; ptr.down = false;
    var m = 70 * U;
    for (var i = 0; i < MOTES; i++)
      motes.push({ x:rand(m, W - m), y:rand(m, H - m), vx:rand(-8,8), vy:rand(-8,8),
                   s:rand(0, 900), r:rand(1.9, 3.4), tied:false, dark:0 });
    spider.x = rand(W * 0.3, W * 0.7);
    spider.y = rand(H * 0.3, H * 0.7);
    spider.a = rand(0, TWO); spider.step = 0;
    spider.state = WALK; spider.hold = 0; spider.prey = -1;
    plantFeet();
  }

  function layout() {
    U = DPR;
    cv.width = W; cv.height = H;
    var m = 14 * U;
    for (var i = 0; i < motes.length; i++) {
      motes[i].x = Math.max(m, Math.min(W - m, motes[i].x));
      motes[i].y = Math.max(m, Math.min(H - m, motes[i].y));
    }
    spider.x = Math.max(m, Math.min(W - m, spider.x));
    spider.y = Math.max(m, Math.min(H - m, spider.y));
   plantFeet();
  }

  /* ---- the specks. they drift on the same curl noise as the dust does */
  function drift(dt) {
    var mg = 16 * U;
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      if (m.tied) {
        m.x += Math.sin(t * 0.7 + m.s) * 0.05 * U;
        m.y += Math.cos(t * 0.61 + m.s) * 0.05 * U;
        if (m.dark < 1) m.dark = Math.min(1, m.dark + dt * 1.5);
        continue;
      }
      curl(m.x / (90 * U) + m.s, m.y / (90 * U) + t * 0.06, c2);
      m.vx += c2[0] * 34 * dt; m.vy += c2[1] * 34 * dt;

      if (grab === i) {
        m.vx += (ptr.x - m.x) * 26 * dt;
        m.vy += (ptr.y - m.y) * 26 * dt;
        m.vx *= 0.86; m.vy *= 0.86;
      } else {
        if (ptr.down) {                      /* the rest scatter out of the way */
          var dx = m.x - ptr.x, dy = m.y - ptr.y, d2 = dx*dx + dy*dy;
          var R = 58 * U;
          if (d2 < R * R) {
            var d = Math.sqrt(d2) + 0.001;
            var f = (1 - d / R) * 300 * dt;
            m.vx += dx / d * f; m.vy += dy / d * f;
          }
        }
        m.vx *= 0.985; m.vy *= 0.985;
      }

      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.x < mg) { m.x = mg; m.vx = Math.abs(m.vx) * 0.5; }
      if (m.x > W - mg) { m.x = W - mg; m.vx = -Math.abs(m.vx) * 0.5; }
      if (m.y < mg) { m.y = mg; m.vy = Math.abs(m.vy) * 0.5; }
      if (m.y > H - mg) { m.y = H - mg; m.vy = -Math.abs(m.vy) * 0.5; }
    }
  }

  /* ---- she goes for whichever speck is nearest, and never in a straight line */
  function hunt(dt) {
    if (spider.state === TIE) {
      spider.hold -= dt;
      spider.step += dt * 1.8;
      if (spider.hold <= 0) {
        var p = spider.prey;
        spider.prey = -1; spider.state = WALK;   /* before the knot: the eighth
                                                    one puts her into the haul */
        knot(p);
      }
      return;
    }
    if (spider.prey < 0 || motes[spider.prey].tied)
      spider.prey = nearestFree(spider.x, spider.y);
    if (spider.prey < 0) return;

    var m = motes[spider.prey];
    var dx = m.x - spider.x, dy = m.y - spider.y;
    var d = Math.sqrt(dx*dx + dy*dy) || 1;
    if (d < 15 * U) { spider.state = TIE; spider.hold = 1.15; return; }

    /* she does not walk straight at it, but the wander goes out of her the
       nearer she gets, and she slows and turns tighter for the last of it —
       at full stride she cannot turn inside her own reach */
    var close = Math.min(1, d / (110 * U));
    var want = Math.atan2(dy, dx) + Math.sin(t * 1.6 + spider.s) * 0.30 * close;
    var da = Math.atan2(Math.sin(want - spider.a), Math.cos(want - spider.a));
    spider.a += da * Math.min(1, dt * 4.0);
    var sp = 40 * U * (0.30 + 0.70 * close);
    spider.x += Math.cos(spider.a) * sp * dt;
    spider.y += Math.sin(spider.a) * sp * dt;
    var mg = 14 * U;                    /* she does not walk off the page */
    spider.x = Math.max(mg, Math.min(W - mg, spider.x));
    spider.y = Math.max(mg, Math.min(H - mg, spider.y));
    spider.step += dt * (1.8 + 3.4 * close);
  }

  function knot(i) {
    var m = motes[i];
    m.tied = true; m.vx = m.vy = 0;
    strands.push({ a:i, b:-1, s:rand(0, 900) });      /* b < 0: tied to her */
    var j = nearestTied(i);
    if (j >= 0) strands.push({ a:i, b:j, s:rand(0, 900) });
    tied++;
    audio.knot(tied);
    if (tied >= NEEDED) { spider.state = HAUL; spider.prey = -1; }
  }

  /* ---- eight of them, and the web reels itself in. it starts as a lean and
         ends as a magnet: whatever is tied on falls faster the closer it gets */
  function haul(dt) {
    var home = 0;
    taut = Math.min(1, taut + dt * 0.5);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i]; if (!m.tied) continue;
      if (m.home) {
        m.x = spider.x + Math.sin(t * 30 + m.s) * 0.7 * U;
        m.y = spider.y + Math.cos(t * 27 + m.s) * 0.7 * U;
        home++; continue;
      }
      var dx = spider.x - m.x, dy = spider.y - m.y;
      var d = Math.sqrt(dx*dx + dy*dy) || 1;
      var acc = (60 + 13000 / (d / U + 40)) * U;
      m.vx += dx / d * acc * dt; m.vy += dy / d * acc * dt;
      m.vx *= 0.99; m.vy *= 0.99;
      m.x += m.vx * dt; m.y += m.vy * dt;
      /* measured after the step, and against how far it went: by the end they
         are moving fast enough to clear the middle in a single frame */
      var ex = spider.x - m.x, ey = spider.y - m.y;
      var reach = 10 * U + Math.sqrt(m.vx*m.vx + m.vy*m.vy) * dt;
      if (ex*ex + ey*ey < reach * reach) { m.home = true; m.x = spider.x; m.y = spider.y; home++; }
    }
    spider.step += dt * 1.6;
    if (home >= NEEDED && blackT < 0) blackT = 0;
  }

  /* ---- and the white is taken back the way the black was */
  var HOLD = 0.34, GATHERED = 34;         /* how wide the held blot gets */
  function closing(dt) {
    blackT += dt;
    if (blackT < HOLD) {                    /* everything she has, in one place */
      var q = blackT / HOLD;
      g.fillStyle = '#000';
      g.beginPath();
      g.arc(spider.x, spider.y, (4 + (GATHERED - 4) * q * q) * U, 0, TWO);
      g.fill();
      return;
    }
    var k = Math.min(1, (blackT - HOLD) / 0.62);
    /* it goes on out from where the blot got to. starting the front at nothing
       shrank it back to a point first, so the whole thing went off twice */
    var r = GATHERED * U + k * k * Math.sqrt(W*W + H*H) * 1.15;
    /* the hard core of the front never falls behind where the blot got to, or
       the solid middle of it steps backwards at the handover */
    var inner = Math.min(r * 0.999, Math.max(r * 0.7, GATHERED * U));
    var gr = g.createRadialGradient(spider.x, spider.y, inner,
                                    spider.x, spider.y, r);
    gr.addColorStop(0, 'rgba(0,0,0,1)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(spider.x, spider.y, r, 0, TWO); g.fill();
    if (k >= 1) {
      phase = SPACE;
      cv.style.display = 'none';
      canvas.style.display = 'block';
      bang(spider.x / W, 1 - spider.y / H);
    }
  }

  /* the threads are not drawn as a curve but walked along, and every step of
     the way is pushed about by the same curl field the specks drift on. so a
     thread sags, and wanders, and the wander crawls along it */
  var SEG = 14;
  function drawWeb() {
    g.lineCap = 'round';
    for (var i = 0; i < strands.length; i++) {
      var st = strands[i], a = motes[st.a], bx, by;
      if (st.b < 0) { bx = spider.x; by = spider.y; }
      else { bx = motes[st.b].x; by = motes[st.b].y; }
      var dx = bx - a.x, dy = by - a.y;
      var len = Math.sqrt(dx*dx + dy*dy) || 1;
      var nx = -dy / len, ny = dx / len;
      var slack = len * (0.050 + 0.075 * Math.sin(t * 0.55 + st.s)) * (1 - taut * 0.94);
      var wob   = len * 0.055 * (1 - taut * 0.94);
      g.strokeStyle = 'rgba(0,0,0,' + (0.10 + 0.18 * a.dark).toFixed(3) + ')';
      g.lineWidth = (0.7 + 0.5 * a.dark) * U;
      g.beginPath();
      for (var q = 0; q <= SEG; q++) {
        var u = q / SEG, bell = Math.sin(u * Math.PI);
        var x = a.x + dx * u, y = a.y + dy * u;
        curl(x / (110 * U) + st.s, y / (110 * U) + t * 0.09, c2);
        x += (nx * slack + c2[0] * wob) * bell;
        y += (ny * slack + c2[1] * wob) * bell;
        if (q === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.stroke();
    }
  }

  /* a speck is not a dot. it is out of focus: the edge is the darkest part of
     it and the middle is nearly clear, with a highlight sitting off-centre, and
     the outline of the whole thing breathes so it is never quite a circle */
  var RIM = 16;
  function drawMotes() {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      var d = m.dark;
      var R = m.r * U * (1.85 - 0.30 * d);
      var gr = g.createRadialGradient(m.x - R * 0.24, m.y - R * 0.28, R * 0.04,
                                      m.x, m.y, R);
      gr.addColorStop(0.00, 'rgba(0,0,0,' + (0.05 + 0.25 * d).toFixed(3) + ')');
      gr.addColorStop(0.42, 'rgba(0,0,0,' + (0.17 + 0.48 * d).toFixed(3) + ')');
      gr.addColorStop(0.84, 'rgba(0,0,0,' + (0.29 + 0.64 * d).toFixed(3) + ')');
      gr.addColorStop(1.00, 'rgba(0,0,0,0)');
      g.fillStyle = gr;
      g.beginPath();
      for (var q = 0; q < RIM; q++) {
        var an = q / RIM * TWO;
        var rr = R * (1 + 0.10 * Math.sin(an * 3 + t * 0.7 + m.s) +
                          0.06 * Math.sin(an * 5 - t * 0.45 + m.s * 1.7));
        var x = m.x + Math.cos(an) * rr, y = m.y + Math.sin(an) * rr;
        if (q === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath(); g.fill();
      if (d > 0.05) {                       /* a knot has a little halo to it */
        g.strokeStyle = 'rgba(0,0,0,' + (0.13 * d).toFixed(3) + ')';
        g.lineWidth = 0.8 * U;
        g.beginPath(); g.arc(m.x, m.y, R + 2.4 * U, 0, TWO); g.stroke();
      }
    }
  }

  /* two bones to a leg, and the knee is wherever it has to be to reach the
     foot. a leg in the air folds tighter, which throws its knee up and out */
  function drawSpider() {
    var cx = spider.x, cy = spider.y, a = spider.a;
    var ca = Math.cos(a), sa = Math.sin(a);
    g.lineCap = 'round';
    for (var i = 0; i < legs.length; i++) {
      var L = legs[i];
      var hip = a + L.s * REST[L.k] * 0.45;
      var hx = cx + Math.cos(hip) * 2.4 * U, hy = cy + Math.sin(hip) * 2.4 * U;
      var L1 = 7.6 * U * (1 + 0.30 * (L.up > 0 ? Math.sin(Math.PI * (1 - L.up)) : 0));
      var L2 = 10.0 * U;
      var dx = L.x - hx, dy = L.y - hy;
      var d = Math.min(Math.sqrt(dx*dx + dy*dy) || 1e-3, (L1 + L2) * 0.995);
      var ux = dx / (Math.sqrt(dx*dx + dy*dy) || 1e-3), uy = dy / (Math.sqrt(dx*dx + dy*dy) || 1e-3);
      var m = (d*d + L1*L1 - L2*L2) / (2*d);
      var h = Math.sqrt(Math.max(0, L1*L1 - m*m));
      var kx = hx + ux * m - uy * h * L.s;
      var ky = hy + uy * m + ux * h * L.s;
      g.strokeStyle = 'rgba(0,0,0,' + (L.up > 0 ? 0.62 : 0.88) + ')';
      g.lineWidth = (L.up > 0 ? 0.8 : 1.0) * U;
      g.beginPath(); g.moveTo(hx, hy); g.lineTo(kx, ky);
      g.lineTo(hx + ux * d, hy + uy * d); g.stroke();
    }
    g.fillStyle = '#000';
    g.beginPath();
    g.ellipse(cx - ca * 2.7 * U, cy - sa * 2.7 * U, 3.4 * U, 2.9 * U, a, 0, TWO);
    g.fill();
    g.beginPath();
    g.ellipse(cx + ca * 1.7 * U, cy + sa * 1.7 * U, 2.0 * U, 1.7 * U, a, 0, TWO);
    g.fill();
  }

  function step(dt) {
    t += dt;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = '#fff';
    g.fillRect(0, 0, W, H);
    drift(dt);
    if (spider.state === HAUL) haul(dt); else hunt(dt);
    walkLegs(dt);
    drawWeb(); drawMotes(); drawSpider();
    if (blackT >= 0) closing(dt);
  }

  function at(e) {
    var p = e.touches ? e.touches[0] : e;
    ptr.x = p.clientX * DPR; ptr.y = p.clientY * DPR;
  }
  cv.addEventListener('pointerdown', function (e) {
    if (ptr.id !== null) return;            /* one hand at a time in here too */
    ptr.id = e.pointerId;
    audio.start(); audio.resume(); at(e); ptr.down = true;
    if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
    grab = nearestFree(ptr.x, ptr.y, 110 * U);
  });
  cv.addEventListener('pointermove', function (e) {
    if (ptr.down && e.pointerId === ptr.id) at(e);
  });
  function drop(e) {
    if (e.pointerId !== ptr.id) return;
    ptr.id = null; ptr.down = false; grab = -1;
  }
  cv.addEventListener('pointerup', drop);
  cv.addEventListener('pointercancel', drop);

  spider.s = Math.random() * 900;

  return { enter: enter, step: step, resize: layout };
})();

resize();
requestAnimationFrame(tick);

})();
</script>
<script data-goatcounter="https://monoganon.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
