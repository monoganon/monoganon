<head>

  <style>

body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000000;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 90vw;
            height: 90vh;
            border: 1px solid rgb(90, 110, 130);
            border-radius: 6px;
            background-image: url('Images/background.gif');
            background-repeat: repeat;
            overflow: hidden;
            box-shadow: 0 0 24px rgba(80, 200, 255, 0.18),
                        inset 0 0 90px rgba(0, 0, 0, 0.55);
        }

        /* soft vignette so the worm reads against the tiled background */
        #game-container::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center,
                        rgba(0,0,0,0) 45%, rgba(0,0,0,0.45) 100%);
            z-index: 50;
        }

        #numpad {
            margin-top: 5vh;
            display: none;
            display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  margin-top: 20px; /* Add some margin on top */
            


}

        .numpad-row {
            display: flex;
            justify-content: center;
        }

        .numpad-button {
            margin: 5vw;
            width: 20vw;
            height: 10vh;
            font-size: 10vw;
            font-weight: bold;
        }

        .game-object {
      position: absolute;
      width: 50px; 
      height: 50px;
    }

    #comet {
      z-index: 20;
      filter: drop-shadow(0 0 8px rgba(255, 210, 120, 0.85));
      animation: comet-pulse 1.6s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes comet-pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.12); }
    }

    /* The worm is one continuous stroked path, drawn on an SVG overlay. */
    #worm-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      overflow: visible;
      filter: drop-shadow(0 0 6px rgba(90, 220, 255, 0.5));
    }

    #game-over-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color:antiquewhite;
  display: block;
  text-align: center;
  font-size: 2vmax;
  z-index: 100;
}


        @media only screen and (max-width: 600px) {
            #numpad {
                display: flex;
                flex-direction: column;
            }
            #game-over-container {
  position: absolute;
  top: 25%;
  left: 50%;
  transform: translate(-50%, -50%);
  color:antiquewhite;
  display: block;
  text-align: center;
  font-size: 3vmax;
  z-index: 100;
}
.game-object {
      position: absolute;
      width: 10vw;
      height: auto;
    }
        }

        @media (max-width: 480px) { /* Apply the style to small devices */
  .numpad-button {
    width: 60px;
    height: 60px;
    font-size: 24px;
  }
}

  <script>
// Direction of the last step the worm actually took, plus the turns waiting to
// be taken. Inputs are validated against the queue rather than against the live
// dx/dy, so two quick presses can no longer fold the worm back on itself.
let directionQueue = [];
    
const restartDelay = 1500; // Delay in milliseconds before the game can be restarted

// Check if the user is on a mobile device
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

let gameOverState = false; // Add this variable to keep track of the game state

    const tileSize = isMobile ? 30 : 50;
    const calculateContainerSize = (tileSize, percentage) => {
  const viewportWidth = window.innerWidth;
  const viewportHeight = window.innerHeight - (isMobile ? 200 : 0); // Reserve space for numpad on mobile
  const viewportSize = Math.min(viewportWidth, viewportHeight);
  const size = Math.floor((viewportSize * percentage) / tileSize) * tileSize;
  return size;
};

    const containerSize = calculateContainerSize(tileSize, 0.8);

    const gameContainer = document.getElementById('game-container');
    const comet = document.getElementById('comet');

    const stepDuration = isMobile ? 140 : 120; // ms per grid step
    const snake = [
  {x: 3 * tileSize, y: 0},
  {x: 2 * tileSize, y: 0},
  {x: 1 * tileSize, y: 0},
  {x: 0, y: 0}
];
    let dx = tileSize;
    let dy = 0;

    const DIRECTIONS = {
      up:    {x: 0, y: -tileSize},
      down:  {x: 0, y: tileSize},
      left:  {x: -tileSize, y: 0},
      right: {x: tileSize, y: 0},
      ArrowUp:    {x: 0, y: -tileSize},
      ArrowDown:  {x: 0, y: tileSize},
      ArrowLeft:  {x: -tileSize, y: 0},
      ArrowRight: {x: tileSize, y: 0}
    };

    let direction = {x: tileSize, y: 0};

    // Queue a turn, measured against the last turn already queued rather than
    // the current heading: pressing up then right while travelling left is two
    // legal turns, but right on its own is a reversal into the neck.
    const queueDirection = (name) => {
      const next = DIRECTIONS[name];
      if (!next || directionQueue.length >= 2) return;

      const previous = directionQueue.length
        ? directionQueue[directionQueue.length - 1]
        : direction;

      const isReversal = next.x === -previous.x && next.y === -previous.y;
      const isSame = next.x === previous.x && next.y === previous.y;
      if (isReversal || isSame) return;

      directionQueue.push(next);
    };

    gameContainer.style.width = containerSize + 'px';
    gameContainer.style.height = containerSize + 'px';

    const wormLayer = document.getElementById('worm-layer');
    const rimGroup = document.getElementById('worm-rim');
    const bodyGroup = document.getElementById('worm-body');
    const ridgeGroup = document.getElementById('worm-ridge');
    const headGroup = document.getElementById('worm-head');

    wormLayer.setAttribute('viewBox', '0 0 ' + containerSize + ' ' + containerSize);

    // Span the gradient across the board in user space, so a segment's colour
    // comes from where it is rather than from the shape of its path.
    const wormGradient = document.getElementById('worm-gradient');
    wormGradient.setAttribute('x1', 0);
    wormGradient.setAttribute('y1', 0);
    wormGradient.setAttribute('x2', containerSize);
    wormGradient.setAttribute('y2', containerSize);

    const bodyWidth = tileSize * 0.78;
    const ridgeAmplitude = tileSize * 0.23;
    const SVG_NS = 'http://www.w3.org/2000/svg';

    // Previous grid positions, so a frame can draw the worm part-way between
    // two steps instead of only on the step itself.
    let prevSnake = snake.map(part => ({x: part.x, y: part.y}));

    const wrapCoord = (v) => ((v % containerSize) + containerSize) % containerSize;

    // Interpolate one segment, taking the short way round when it wraps an edge.
    const lerpPart = (from, to, alpha) => {
      let fx = from.x;
      let fy = from.y;
      if (to.x - fx > tileSize) fx += containerSize;
      else if (to.x - fx < -tileSize) fx -= containerSize;
      if (to.y - fy > tileSize) fy += containerSize;
      else if (to.y - fy < -tileSize) fy -= containerSize;
      return {
        x: wrapCoord(fx + (to.x - fx) * alpha) + tileSize / 2,
        y: wrapCoord(fy + (to.y - fy) * alpha) + tileSize / 2
      };
    };

    // A body that wraps an edge is drawn as two runs rather than one line
    // stretched back across the whole board.
    const splitRuns = (points) => {
      const runs = [];
      let run = [points[0]];
      for (let i = 1; i < points.length; i++) {
        const far = Math.abs(points[i].x - points[i - 1].x) > tileSize * 1.5 ||
                    Math.abs(points[i].y - points[i - 1].y) > tileSize * 1.5;
        if (far) {
          runs.push(run);
          run = [];
        }
        run.push(points[i]);
      }
      runs.push(run);
      return runs;
    };

    const lineThrough = (run) =>
      run.map((pt, i) => (i ? 'L' : 'M') + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1)).join(' ');

    // Zigzag ridge: between each pair of body points, step out to a peak on
    // alternating sides. The side depends on the index, so the pattern is
    // fixed relative to the head and travels along with the worm.
    const ridgeThrough = (run, offset) => {
      if (run.length < 2) return '';
      let d = 'M' + run[0].x.toFixed(1) + ' ' + run[0].y.toFixed(1);
      for (let i = 0; i < run.length - 1; i++) {
        const a = run[i];
        const b = run[i + 1];
        const vx = b.x - a.x;
        const vy = b.y - a.y;
        const len = Math.hypot(vx, vy) || 1;
        const side = (i + offset) % 2 === 0 ? 1 : -1;
        const peakX = (a.x + b.x) / 2 + (-vy / len) * ridgeAmplitude * side;
        const peakY = (a.y + b.y) / 2 + (vx / len) * ridgeAmplitude * side;
        d += ' L' + peakX.toFixed(1) + ' ' + peakY.toFixed(1) +
             ' L' + b.x.toFixed(1) + ' ' + b.y.toFixed(1);
      }
      return d;
    };

    // Reuse child nodes across frames; only add or drop when the run count changes.
    const syncChildren = (group, tag, count) => {
      while (group.childNodes.length < count) {
        group.appendChild(document.createElementNS(SVG_NS, tag));
      }
      while (group.childNodes.length > count) {
        group.removeChild(group.lastChild);
      }
      return group.childNodes;
    };

    const paintRuns = (group, runs, toPath, attrs) => {
      const nodes = syncChildren(group, 'path', runs.length);
      runs.forEach((run, i) => {
        const node = nodes[i];
        node.setAttribute('d', toPath(run, i));
        for (const key in attrs) node.setAttribute(key, attrs[key]);
      });
    };

    const renderWorm = (alpha) => {
      const points = snake.map((part, i) =>
        lerpPart(prevSnake[i] || part, part, alpha));
      const runs = splitRuns(points);

      // Offset keeps the zigzag phase continuous across a split run.
      let consumed = 0;
      const ridgeOffsets = runs.map(run => {
        const offset = consumed;
        consumed += run.length - 1;
        return offset;
      });

      paintRuns(rimGroup, runs, lineThrough, {
        fill: 'none',
        stroke: '#0d3f66',
        'stroke-width': bodyWidth + 5,
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round'
      });

      paintRuns(bodyGroup, runs, lineThrough, {
        fill: 'none',
        stroke: 'url(#worm-gradient)',
        'stroke-width': bodyWidth,
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round'
      });

      paintRuns(ridgeGroup, runs, (run, i) => ridgeThrough(run, ridgeOffsets[i]), {
        fill: 'none',
        stroke: '#d8fbff',
        'stroke-width': Math.max(2, tileSize * 0.09),
        'stroke-linecap': 'round',
        'stroke-linejoin': 'round',
        opacity: '0.85'
      });

      drawHead(points[0], points[1] || points[0]);
    };

    // Head is a slightly fatter cap with a pair of eyes facing the way it moves.
    const drawHead = (head, neck) => {
      const nodes = syncChildren(headGroup, 'circle', 3);
      let vx = head.x - neck.x;
      let vy = head.y - neck.y;
      const len = Math.hypot(vx, vy);
      if (len < 0.001) { vx = 1; vy = 0; } else { vx /= len; vy /= len; }

      const skull = nodes[0];
      skull.setAttribute('cx', head.x.toFixed(1));
      skull.setAttribute('cy', head.y.toFixed(1));
      skull.setAttribute('r', (bodyWidth / 2 + 2).toFixed(1));
      skull.setAttribute('fill', 'url(#worm-gradient)');

      const eyeOut = tileSize * 0.17;
      const eyeFwd = tileSize * 0.12;
      for (let i = 1; i <= 2; i++) {
        const side = i === 1 ? 1 : -1;
        const eye = nodes[i];
        eye.setAttribute('cx', (head.x + vx * eyeFwd + -vy * eyeOut * side).toFixed(1));
        eye.setAttribute('cy', (head.y + vy * eyeFwd + vx * eyeOut * side).toFixed(1));
        eye.setAttribute('r', Math.max(1.5, tileSize * 0.07).toFixed(1));
        eye.setAttribute('fill', '#06283d');
      }
    };

    const resetWormTrail = () => {
      prevSnake = snake.map(part => ({x: part.x, y: part.y}));
      renderWorm(1);
    };
let isMouseDown = false;
let mouseStartX;
let mouseStartY;

const handleMouseDown = (event) => {
  isMouseDown = true;
  mouseStartX = event.clientX;
  mouseStartY = event.clientY;
};

const handleMouseMove = (event) => {
  if (!isMouseDown) return;
  event.preventDefault();
};

const handleMouseUp = (event) => {
  if (!isMouseDown) return;
  isMouseDown = false;

  const mouseEndX = event.clientX;
  const mouseEndY = event.clientY;

  const diffX = mouseStartX - mouseEndX;
  const diffY = mouseStartY - mouseEndY;

  if (Math.abs(diffX) > Math.abs(diffY)) {
    queueDirection(diffX > 0 ? 'left' : 'right');
  } else {
    queueDirection(diffY > 0 ? 'up' : 'down');
  }
};



// const gameContainer = document.getElementById('game-container');
let lastTouchTime = 0;
const doubleTapDelay = 300; // Time (in milliseconds) allowed between taps for a double tap

let touchStartX;
let touchStartY;

const handleTouchStart = (event) => {
  touchStartX = event.touches[0].clientX;
  touchStartY = event.touches[0].clientY;
};

const handleTouchMove = (event) => {
  event.preventDefault();
};

const handleTouchEnd = (event) => {
  const touchEndX = event.changedTouches[0].clientX;
  const touchEndY = event.changedTouches[0].clientY;

  const diffX = touchStartX - touchEndX;
  const diffY = touchStartY - touchEndY;

  if (Math.abs(diffX) > Math.abs(diffY)) {
    queueDirection(diffX > 0 ? 'left' : 'right');
  } else {
    queueDirection(diffY > 0 ? 'up' : 'down');
  }
};

if (isMobile) {
  gameContainer.addEventListener('touchstart', handleTouchStart, { passive: false });
  gameContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
  gameContainer.addEventListener('touchend', handleTouchEnd, { passive: false });
}

gameContainer.addEventListener('mousedown', handleMouseDown);
gameContainer.addEventListener('mousemove', handleMouseMove);
gameContainer.addEventListener('mouseup', handleMouseUp);



const updateCometPosition = () => {
  const containerWidth = gameContainer.clientWidth;
  const containerHeight = gameContainer.clientHeight;
  const maxGridX = Math.floor(containerWidth / tileSize) - 1;
  const maxGridY = Math.floor(containerHeight / tileSize) - 1;
  let x, y, isOccupied;

  do {
    x = Math.floor(Math.random() * maxGridX) * tileSize;
    y = Math.floor(Math.random() * maxGridY) * tileSize;
    isOccupied = snake.some(part => part.x === x && part.y === y);
  } while (isOccupied);

  comet.style.left = x + 'px';
  comet.style.top = y + 'px';


};






const moveSnake = () => {
  // Apply at most one turn per step, and do it before the head moves so the
  // turn lands on this step instead of the next one.
  if (directionQueue.length) direction = directionQueue.shift();
  dx = direction.x;
  dy = direction.y;

  const headX = (snake[0].x + dx + containerSize) % containerSize;
  const headY = (snake[0].y + dy + containerSize) % containerSize;

  prevSnake = snake.map(part => ({x: part.x, y: part.y}));

  for (let i = 1; i < snake.length; i++) {
    if (snake[i].x === headX && snake[i].y === headY) {
      gameOver();
      return;
    }
  }

  if (headX === parseInt(comet.style.left) && headY === parseInt(comet.style.top)) {
    snake.push({x: headX - dx, y: headY - dy});
    updateCometPosition();
  }

  for (let i = snake.length - 1; i > 0; i--) {
    snake[i].x = snake[i - 1].x;
    snake[i].y = snake[i - 1].y;
  }

  snake[0].x = headX;
  snake[0].y = headY;
};

// Fixed-timestep loop driven by requestAnimationFrame: steps land on a steady
// cadence and rendering stays in sync with the display's refresh.
let rafId = null;
let stepAccumulator = 0;
let lastFrameTime = 0;

const gameLoop = (now) => {
  rafId = requestAnimationFrame(gameLoop);

  const delta = now - lastFrameTime;
  lastFrameTime = now;

  // Ignore huge gaps (tab was backgrounded) instead of fast-forwarding.
  stepAccumulator += Math.min(delta, stepDuration * 3);

  while (stepAccumulator >= stepDuration) {
    stepAccumulator -= stepDuration;
    moveSnake();
    if (gameOverState) return;
  }

  renderWorm(stepAccumulator / stepDuration);
};

const startLoop = () => {
  stopLoop();
  stepAccumulator = 0;
  lastFrameTime = performance.now();
  rafId = requestAnimationFrame(gameLoop);
};

const stopLoop = () => {
  if (rafId !== null) cancelAnimationFrame(rafId);
  rafId = null;
};


const saveScore = () => {
  const playerName = document.getElementById('player-name').value;
  const elapsedTime = parseInt(document.getElementById('elapsed-time').innerText);
  const score = parseInt(document.getElementById('final-score').innerText);

  const storedScores = localStorage.getItem('scores');
  const scores = storedScores ? JSON.parse(storedScores) : [];

  scores.push({ name: playerName, score: score, time: elapsedTime });
  localStorage.setItem('scores', JSON.stringify(scores));

  updateScoreboard();
};

const updateScoreboard = () => {
  const scoreList = document.getElementById('score-list');
  scoreList.innerHTML = '';

  const storedScores = localStorage.getItem('scores');
  const scores = storedScores ? JSON.parse(storedScores) : [];

  for (const { name, score } of scores) {
    const listItem = document.createElement('li');
    listItem.textContent = `${name}: ${score}`;
    scoreList.appendChild(listItem);
  }
};

const showGameOver = () => {
  const gameoverContainer = document.getElementById('game-over-container');
  if (!gameoverContainer) {
    return;
  }

  gameoverContainer.innerHTML = ''; // Clear the contents of the container

  const elapsedTime = Math.floor((Date.now() - startTime) / 1000);

  const gameOverMessage = document.createElement('h2');
  gameOverMessage.innerText = 'Game Over!';
  gameoverContainer.appendChild(gameOverMessage);

  const finalScoreMessage = document.createElement('p');
  const score = (snake.length - 3) * 7;
  finalScoreMessage.innerHTML = `Score: ${score}`;
  gameoverContainer.appendChild(finalScoreMessage);

  const elapsedTimeMessage = document.createElement('p');
  elapsedTimeMessage.innerHTML = `Elapsed time: ${elapsedTime} seconds`;
  gameoverContainer.appendChild(elapsedTimeMessage);
  gameoverContainer.style.display = 'block';
};




const gameOver = () => {
    gameOverState = true;
  stopLoop();
  navigator.vibrate(200)
  
  const gameoverContainer = document.getElementById('game-over-container');
  gameoverContainer.innerHTML = ''; // Clear the container's content

  const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
  const score = (snake.length - 1) * elapsedTime;

  const gameOverMessage = document.createElement('h2');
  gameOverMessage.innerText = 'Game Over!';
  gameoverContainer.appendChild(gameOverMessage);

  const finalScoreMessage = document.createElement('p');
  finalScoreMessage.innerHTML = `Score: ${score}`;
  gameoverContainer.appendChild(finalScoreMessage);

  const elapsedTimeMessage = document.createElement('p');
  elapsedTimeMessage.innerHTML = `Elapsed time: ${elapsedTime} seconds`;
  gameoverContainer.appendChild(elapsedTimeMessage);

  const restartMessage = document.createElement('p');
  restartMessage.innerHTML = 'Press any key to restart the game';
  gameoverContainer.appendChild(restartMessage);

  gameoverContainer.style.display = 'block';
};

let lastRestart = 0;

const restart = () => {
  const currentTime = new Date().getTime();
  const timeSinceLastRestart = currentTime - lastRestart;

  if (timeSinceLastRestart < restartDelay) { // 1000 milliseconds = 1 second
    return; // Don't restart if less than 1 second has passed
  }

  lastRestart = currentTime;

  stopLoop();

  const gameoverContainer = document.getElementById('game-over-container');
  gameoverContainer.style.display = 'none'; // Hide the game-over message

  // Reinitialize the snake array
  snake.length = 0;
  snake.push(
    {x: 3 * tileSize, y: 0},
    {x: 2 * tileSize, y: 0},
    {x: 1 * tileSize, y: 0},
    {x: 0, y: 0}
  );

  dx = tileSize;
  dy = 0;
  direction = {x: tileSize, y: 0};
  directionQueue = [];
  updateCometPosition();
  resetWormTrail();
  startTime = new Date().getTime(); // Reset the start time
  gameOverState = false;
  startLoop();
};


document.addEventListener('keydown', function (event) {
  if (gameOverState) {
    setTimeout(restart, restartDelay);
    return;
  }

  if (event.key === ' ') {
    restart();
    return;
  }

  queueDirection(event.key);
});


if (isMobile) {
  // Show the numpad when the game starts
  document.getElementById('numpad').style.display = 'block';

  const numpadButtons = document.querySelectorAll('.numpad-button');

  const handleNumpadInput = (event) => {
  if (gameOverState) {
    setTimeout(restart, restartDelay);
    return;
  }

  navigator.vibrate(20)
  queueDirection(event.target.getAttribute('data-direction'));
};

numpadButtons.forEach(button => {
  // Remove the 'click' event listener for mobile devices
  if (!isMobile) {
    button.addEventListener('click', handleNumpadInput);
  }
  
  button.addEventListener('touchstart', handleNumpadInput);
});


}

  // Show the numpad again when the game is over
