<script>
(function () {
  var PLAY = '_2w-yo', PAUSE = 'ldPDa';
  var pool = {};
  [].forEach.call(document.querySelectorAll('audio[data-track]'), function (a) {
    pool[a.getAttribute('data-track')] = a;
  });

  // the collage's own player buttons: wire each to its track
  [].forEach.call(document.querySelectorAll('[data-skin="SimplePlayer"]'), function (w) {
    var m = (w.getAttribute('aria-label') || '').match(/Audio player,\s*(.+?)\s*$/);
    if (!m) return;
    var file = m[1].toLowerCase().replace(/'/g, '').replace(/\s+/g, '-');
    var a = pool[file];
    if (!a) {
      a = new Audio('sounds/' + file);
      a.loop = true;
      pool[file] = a;
    }
    var btn = w.querySelector('button');
    if (!btn) return;
    btn.addEventListener('click', function () { a.paused ? a.play() : a.pause(); });
    function sync() {
      var icon = btn.querySelector('span');
      btn.setAttribute('aria-pressed', a.paused ? 'false' : 'true');
      btn.setAttribute('aria-label', a.paused ? 'Play' : 'Pause');
      if (icon && PLAY && PAUSE) {
        icon.classList.toggle(PLAY, a.paused);
        icon.classList.toggle(PAUSE, !a.paused);
      }
    }
    a.addEventListener('play', sync);
    a.addEventListener('pause', sync);
    sync();
  });

  // browsers refuse to start audio before the visitor interacts with the page,
  // so try straight away and fall back to the first touch/click/keypress
  var first = document.getElementById('audioElement');
  if (!first) return;
  function label() {
    var b = document.querySelector('.mono-bar button');
    if (b) b.innerHTML = first.paused ? 'Play' : 'Stop';
  }
  function start() {
    var p = first.play();
    if (p && p.then) p.then(label).catch(function () {});
    else label();
  }
  start();
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (e) {
    document.addEventListener(e, function once() {
      if (first.paused) start();
      ['pointerdown', 'keydown', 'touchstart'].forEach(function (x) {
        document.removeEventListener(x, once);
      });
    });
  });
  first.addEventListener('play', label);
  first.addEventListener('pause', label);
